<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호이스팅</title>
</head>
<body>
  <script>
    // 호이스팅이란?
    // - 아직 선언되지 않은 함수나 변수들을, 해당 스코프의 맨 위로 끌어올려 사용하는 작동 방식

    console.log("---------- 함수 호이스팅 ----------");

    print();

    function print() {
      console.log("print 함수가 호출되었습니다.");
    }

    console.log("---------- 변수 호이스팅 ----------");
    
    // var
    console.log(num); // undefined

    var num = 10;

    var num2;
    console.log(num2); // undefined
    num2 = 20;

    // let & const 사용시 호이스팅 error 발생
    // - TDZ (Temporal Dead Zone) : 일시적인 사각지대, 변수를 사용하는 것을 허용하지 않는 공간
    // - var는 변수 선언 완료시 메모리 공간이 할당
    // - let & const는 변수의 값이 할당되어야 메모리 공간이 할당

    console.log(varNum); // undefined
    var varNum = 10;

    console.log(letNum); // ReferenceError: letNum is not defined
    let letNum = 15;

    console.log(constNum); // ReferenceError: constNum is not defined
    const constNum = 20;

   
  </script>
</body>
</html>
