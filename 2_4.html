<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>변수와 상수</title>
</head>

<body>

  <!-- 변수 -->
  <script type="text/javascript">
    let message = "Hello";
    alert(message); // 문자열을 저장합니다.

    message = "Hello!"; // 변수를 정의하고 값을 할당합니다.
    alert(message); // Hello! 
  </script> 

  <!-- 변수 명명 규칙 -->
  <script type="text/javascript">
    /*
    1. 변수명에는 오직 문자와 숫자, 그리고 기호 $와 _만 들어갈 수 있습니다.
    2. 첫 글자는 숫자가 될 수 없습니다.
    */

    let userName;
    let test123;

    let $ = 1; // '$'라는 이름의 변수를 선언합니다.
    let _ = 2; // '_'라는 이름의 변수를 선언합니다.

    alert($ + _); // 3

    /* --- 잘뫗된 변수명 예시 --- */
    // let 1a;
    // let my-name;

    /* --- 대소문자 구분 --- */
    //apple와 AppLE은 서로 다른 변수입니다.
    let apple;
    let AppLE;
  </script>

  <!-- 상수 -->
  <script type="text/javascript">
    const myBirthday = '18.04.1982';
    myBirthday = '01.01.2001';
    alert(myBirthday); // error, can't reassign the constant!

    /*--- 대문자 상수 ---*/
    // 기억하기 힘든 값을 변수에 할당해 별칭으로 사용하는 것은 널리 사용되는 관습입니다.
    // 이런 상수는 대문자와 밑줄로 구성된 이름으로 명명합니다.
    // 예시로 웹에서 사용하는 색상 표기법인 16진수 컬러 코드에 대한 상수를 한번 만들어보겠습니다.

    const COLOR_RED = "#F00";
    const COLOR_GREEN = "#0F0";
    const COLOR_BLUE = "#00F";
    const COLOR_ORANGE = "#FF7F00";

    let color = COLOR_ORANGE; // 색상을 고르고 싶을 때 별칭을 사용할 수 있게 되었습니다.
    alert(color); // #FF7F00

    /*--- 바람직한 변수명 ---*/
    // userName 이나 shoppingCart처럼 사람이 읽을 수 있는 이름을 사용하세요.
    // 무엇을 하고 있는지 명확히 알고 있지 않을 경우 외에는 줄임말이나 a, b, c와 같은 짧은 이름은 피하세요.
    // 최대한 서술적이고 간결하게 명명해 주세요.data와 value는 나쁜 이름의 예시입니다.이런 이름은 아무것도 설명해주지 않습니다.코드 문맥상 변수가 가리키는 데이터나 값이 아주 명확할 때에만 이런 이름을 사용합시다.
    // 자신만의 규칙이나 소속된 팀의 규칙을 따르세요. 만약 사이트 방문객을 'user’라고 부르기로 했다면, 이와 관련된 변수를 currentVisitor나 newManInTown이 아닌 currentUser나 newUser라는 이름으로 지어야 합니다.

    // var, let, const를 사용해 변수를 선언할 수 있습니다. 선언된 변수엔 데이터를 저장할 수 있죠.

    // let – 모던한 변수 선언 키워드입니다.
    // var – 오래된 변수 선언 키워드입니다. 잘 사용하지 않습니다. let과의 미묘한 차이점은 오래된 var 챕터에서 다루도록 하겠습니다.
    // const – let과 비슷하지만, 변수의 값을 변경할 수 없습니다.
  </script>

  <!-- 과제 -->
  <script type="text/javascript">
    /*--- 과제 1 ---*/
    // 1. admin과 name이라는 변수를 선언하세요.
    // 2. name에 값으로 "John"을 할당해 보세요.
    // 3. name의 값을 admin에 복사해 보세요.
    // 4. admin의 값을 alert 창에 띄워보세요. "John"이 출력되어야 합니다.
  
    let admin;
    let name;
    name = 'John';
    admin = name;
    alert(admin);

    /*--- 과제 2 ---*/
    // 1. 현재 우리가 살고있는 행성(planet)의 이름을 값으로 가진 변수를 만들어보세요. 변수 이름은 어떻게 지어야 할까요?
    // 2. 웹사이트를 개발 중이라고 가정하고, 현재 접속 중인 사용자(user)의 이름(name)을 저장하는 변수를 만들어보세요. 변수 이름은 어떻게 지어야 할까요?
    
    let ourPlanetName = 'Earth';
    let currentUserName = 'John';

    /*--- 과제 3 ---*/
    // age라는 상수는 나이에 관한 값을 담고 있는데 birthday를 조작하여 그 값을 도출합니다(생일을 이용하여 나이를 도출하는 코드는 간결성을 위해 여기선 언급하지 않겠습니다. 이 문제에서 해당 코드가 중요한 역할을 하지 않기도 합니다).
  
    const birthday = '18.04.1982';
    const age = someCode(birthday); // someCode는 미지의 함수입니다.

    /*
    대문자 상수는 ‘하드 코딩한’ 값의 별칭을 만들 때 주로 사용합니다. 실행 전에 이미 값을 알고 있고, 코드에서 직접 그 값을 쓰는 경우에 사용하죠.
    위 코드에서 birthday가 그런 경우입니다. 따라서 birthday는 대문자 상수로 적합합니다.
    반면, age는 런타임에 평가됩니다. 올해의 나이와 내년의 나이는 다르죠. 상수는 코드가 실행될 때마다 바뀌지 않아야 하는 값이란 걸 아마 느끼셨을 겁니다. 이런 관점에서 보았을 때, age는 birthday보다 덜 상수스럽습니다. 런타임에 계산되죠. 따라서 age는 대문자 상수에 적합하지 않습니다.
    */
  </script>
</body>

</html>
