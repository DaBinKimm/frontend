<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배열 내장함수-2</title>
</head>

<body>
  <script>
    console.log('---------- concat 메서드 : 배열을 결합하는 방법  ----------')
    let array1 = ["green", "blue"];
    let array2 = ["purple", "yellow"];

    console.log(array1.concat(array2)); // [ 'green', 'blue', 'purple', 'yellow' ]


    console.log('---------- join 메서드 : 배열을 문자열로 변환하는 방법  ----------');
    let array3 = ["green", "blue", "purple", "yellow"];
    console.log(array3.join()); // green,blue,purple,yellow
    console.log(array3.join(" ")); // green blue purple yellow
    console.log(array3.join("-")); // green-blue-purple-yellow

    console.log('---------- sort 메서드 : 배열을 정렬하는 방법 (문자열 정렬)  ----------');

    let colors = ["green", "blue", "purple"];
    colors.sort();

    console.log(colors); // [ 'blue', 'green', 'purple' ] : 알파벳 오름차순 정렬
    colors.sort().reverse();
    console.log(colors); // [ 'purple', 'green', 'blue' ] : 알파벳 내림차순 정렬


    console.log('---------- compare 함수 : 배열 요소의 크기를 비교하는 방법  ----------');
    const color2Compare = (a, b) => { // a: 배열의 다음 요소 (ex: blue), b: 배열의 이전 요소 (ex: green)
      if (a > b) return -1; // 0보다 작은 값(-1) : a가 b보다 앞에 있어야 함.
      else if (a < b) return 1; // 0보다 큰 값(1) : b가 a보다 앞에 있어야 함.
      else return 0; // 0 : 순서 변경 없음.
    }

    let colors2 = ["green", "blue", "purple"];
    colors2.sort(color2Compare);
    console.log(colors2); // [ 'purple', 'green', 'blue' ] : 알파벳 내림차순 정렬

    const numberUpSortCompare = (a, b) => { // 오름차순 정렬
      return a - b; // a값이 b값보다 작으면 음수, 크면 양수, 같으면 0을 반환
    }

    const numberDownSortCompare = (a, b) => { // 내림차순 정렬
      return b - a; // b값이 a값보다 작으면 음수, 크면 양수, 같으면 0을 반환
    }

    const numbers = [1, 100, 25, 50, 120, 3];
    numbers.sort();
    console.log(numbers); // [ 1, 100, 120, 25, 3, 50 ] : 숫자 문자열 오름차순 정렬
    numbers.sort(numberUpSortCompare);
    console.log(numbers); // [ 1, 3, 25, 50, 100, 120 ] : 숫자 오름차순 정렬
    numbers.sort(numberDownSortCompare);
    console.log(numbers); // [ 120, 100, 50, 25, 3, 1 ] : 숫자 내림차순 정렬


    console.log('---------- reduce 메서드 : 배열의 모든 요소를 더하는 방법  ----------');
    const numbers2 = [1, 100, 25, 50];
    let sum = numbers2.reduce((acc, cur, idx) => { // acc: 누적값, cur: 현재값, idx: 인덱스
      console.log(`acc: ${acc}, cur: ${cur}, idx: ${idx}`); // 초기값 0, 1, 0 / 1, 100, 1 / 101, 25, 2 / 126, 50, 3
      return acc + cur;
    }, 2) // 0: 초기값

    console.log(sum); // 176


    console.log('---------- isArray 메서드 : 배열인지 확인하는 방법  ----------');
    let a = Array.isArray([1, 100, 50]);
    let b = Array.isArray({id:1, color: "green"});
    let c = Array.isArray("string");
    let d = Array.isArray(undefined);
    console.log(a,b,c,d); // true false false false
  </script>
</body>

</html>
