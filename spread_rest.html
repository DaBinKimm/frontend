<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spread & rest</title>
</head>

<body>
  <script>
    console.log('-------------------- spread --------------------');
    // spread : 객체나 배열의 속성을 다른 객체에 복사하는 연산자

    // 객체
    const toy = {
      type: "bear",
      price: 15000,
    };

    const blueToy = {
      ...toy,
      color: "blue",
    };

    const yellowToy = {
      ...toy,
      color: "yellow",
    };

    console.log(blueToy);
    console.log(yellowToy);

    // 배열
    const color1 = ["red", "orange", "yellow"];
    const color2 = ["blue", "navy", "purple"];

    const rainbow = [...color1, "green", ...color2];

    console.log(rainbow);


    console.log('-------------------- rest --------------------');
    // rest : 구조 분해나 함수 매개변수에서 나머지 값을 하나의 객체나 배열로 모으는 연산자

    // 객체
    const blueToy2 = {
      type: "bear",
      price: 15000,
      color: "blue"
    };

    const {
      type,
      ...rest
    } = blueToy2; // rest는 객체의 나머지 속성을 복사하는 연산자, rest는 가장 마지막에 와야 함, 순서에 상관없이 여러번 사용할 수 없음.

    console.log(type);
    console.log(rest);

    // 배열
    const color3 = ["red", "orange", "yellow", "green"];
    const [c1, c2, ...rest2] = color3;
    console.log(c1, c2);
    console.log(rest2);

    // 함수
    const print = (a, b, ...rest3) => { // [a, b, c, d, e, f], 매개변수가 많거나 몇개가 될지 모를 때 함수에서 받아온 매개변수들을 배열로 받아오기 위해 사용
      console.log(a, b, rest3);
    }

    print(1, 2, 3, 4, 5, 6);


    console.log('-------------------- spread & rest --------------------');
    const print2 = (...rest4) => {
      console.log(rest4);
    };
    const numbers = [1, 2, 3, 4, 5, 6];
    // print2(numbers[0], numbers[1], numbers[2], numbers[3], numbers[4], numbers[5]);
    print2(...numbers);
  </script>

</body>

</html>
