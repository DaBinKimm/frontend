<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alert, prompt, confirm을 이용한 상호작용</title>
</head>

<body>
  <!-- alert : 경고창을 표시합니다. -->
  <script>
    alert("Hello, world!");
  </script>

  <!-- prompt : 사용자에게 입력을 받습니다. -->
  <script>
    let age = prompt('나이를 입력해주세요.', 100);
    alert(`당신의 나이는 ${age}살 입니다.`); // 당신의 나이는 100살입니다.
  </script>

  <!-- confirm : 확인 또는 취소 버튼을 표시합니다. -->
  <script>
    let isBoss = confirm("당신이 주인인가요?");
    alert( isBoss ); // 확인 버튼을 눌렀다면 true가 출력됩니다.
  </script>
</body>

</html>
