    console.log("-------------------- Promise 객체 --------------------");
    // new Promise : state - pending(대기) / result - undefined
    // resolve : state - fulfilled(성공) / result - value
    // reject : state - rejected(실패) / result - error

    // then : 성공 시 호출되는 함수
    // catch : 실패 시 호출되는 함수
    // finally : 성공 또는 실패 시 호출되는 함수

    const executor = (resolve,
      reject
    ) => { // executor: promise 객체를 생성할 때 실행되는 함수, resolve = Promise가 만든 "성공 알림" 함수, reject  = Promise가 만든 "실패 알림" 함수
      setTimeout(() => {
        // resolve("성공")
        reject("실패")
      }, 3000);
    }

    const promise = new Promise(executor);

    promise
      .then((res) => {
        console.log(res);
      })
      .catch((err) => {
        console.log(err);
      });


    console.log("-------------------- Promise 예제 --------------------");

    const workA = (value) => {
      const promise = new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve(value + 5);
        }, 5000);
      });

      return promise;
    }

    const workB = (value) => {
      const promise = new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve(value - 3);
        }, 3000);
      });
      return promise;
    }

    const workC = (value) => {
      const promise = new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve(value + 10);
        }, 10000);
      });
      return promise;
    }

    workA(10).then((resA) => {
      console.log(`1. ${resA}`);
      return workB(resA);
    }).then((resB) => {
      console.log(`2. ${resB}`);
      return workC(resB);
    }).then((resC) => {
      console.log(`3. ${resC}`);
    });
