<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반복문</title>
</head>
<body>
  <script>
    console.log('---------- for 반복문 ----------')
    // 증가하는 반복문
    for(let i = 1; i <= 5; i++) {
      console.log(i);
    }

    // 감소하는 반복문
    for(let i = 5; i >= 1; i--) {
      console.log(i);
    }

    console.log('---------- while 반복문 ----------')
    let i = 1;
    while(i <= 5) {
      console.log(i);
      i++;
    }

    console.log('---------- for문 -  배열의 모든 요소 출력 ----------')
    let arr = [1, 2, 3, 4, 5];
    for(let i = 0; i < arr.length; i++) {
      console.log(arr[i]);
    }

    console.log('---------- for문 - 객체의 모든 요소 출력 ----------')
    let person = {
      name : "홍길동",
      age : 20,
      height : 180,
    }

    // 객체의 모든 키 출력
    console.log(Object.keys(person)); // [ 'name', 'age', 'height' ]

    let newArray = Object.keys(person);
    for(let i = 0; i < newArray.length; i++) {
      let nowkey = newArray[i];
      console.log(`key : ${nowkey}, value : ${person[nowkey]}`); // key : name, value : 홍길동, key : age, value : 20, key : height, value : 180
    }
    
    // 객체의 모든 값 출력
    console.log(Object.values(person)); // [ '홍길동', 20, 180 ]

    let newArray2 = Object.values(person); // [ '홍길동', 20, 180 ]
    for(let i = 0; i < newArray2.length; i++) {
      console.log(`value : ${newArray2[i]}`); // value : 홍길동, value : 20, value : 180
    }

    // 객체의 모든 키와 값 출력
    console.log(Object.entries(person)); // [ ['name', '홍길동'], ['age', 20], ['height', 180] ]

    let newArray3 = Object.entries(person);
    for(let i = 0; i < newArray3.length; i++) {    
      console.log(`key : ${newArray3[i][0]}, value : ${newArray3[i][1]}`); // key : name, value : 홍길동, key : age, value : 20, key : height, value : 180
    }

    console.log('---------- for of 반복문 : 배열에서 주로 사용 ----------')
    let arr2 = [1, 2, 3, 4, 5];
    for (let i of arr2) {
      console.log(i); // 1, 2, 3, 4, 5
    }

    console.log('---------- for in 반복문 : 객체에서 주로 사용----------')
    let person2 = {
      name : "홍길동",
      age : 25,
      height : 180,
    }

    for (let key in person2) {
      console.log(`key : ${key}, value : ${person2[key]}`); // key name, value 홍길동, key age, value 25, key height, value 180
    }
  </script>
</body>
</html>
