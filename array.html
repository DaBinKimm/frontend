<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배열</title>
</head>
<body>
  <script>
    // 배열 - 순서가 있는 요소들의 집합, 여러개의 항목들이 모여 있는 리스트
    
    console.log('-------------------- 배열 생성 --------------------')
    // 배열 생성 방법 1
    let array1 = new Array(1, 2, 3);
    let array2 = new Array(3); // 3개의 요소를 가지는 배열을 생성
    console.log(array1); // [1, 2, 3]
    console.log(array2); // [undefined, undefined, undefined]

    // 배열 생성 방법 2
    let array3 = [1, 2, 3];
    let array4 = [3];
    console.log(array3); // [1, 2, 3]
    console.log(array4); // [3]

    // 배열의 요소에 접근하는 방법
    let arr = [    
      {name: "홍길동"},       
      1,
      function() {
        console.log("hello world");
      },
      null,
      undefined
    ];
    console.log(arr);

    // 배열의 요소에 접근하는 방법
    let arr2 = [1, "hello", null]
    console.log(arr2[0]); // 1
    console.log(arr2[1]); // "hello"
    console.log(arr2[2]); // null    

    console.log('-------------------- 배열 요소 추가 --------------------')
    let arr3 = [1, "hello", null]

    // 배열 요소 추가 방법 1    
    arr3.push(4);
    console.log(arr3); // [1, "hello", null, 4]

    // 배열 요소 추가 방법 2
    arr3.unshift(0);
    console.log(arr3); // [0, 1, "hello", null, 4]

    console.log('-------------------- 배열 요소 수정 --------------------')    
    let arr4 = [1, "hello", null]

    // 배열 요소 수정 방법 1
    arr4[0] = 5;
    arr4[2] = undefined;
    console.log(arr4); // [5, "hello", undefined]

    // const 키워드로 선언한 배열의 요소를 수정할 수 있음
    const arr5 = [1, "hello", null]
    arr5[0] = 5;
    arr5[2] = undefined;
    console.log(arr5); // [5, "hello", undefined]

    console.log('-------------------- 배열 요소 삭제 --------------------')
    let arr6 = [1, "hello", null];

    arr6.shift(); // [ "hello", null] - 첫 번째 요소를 삭제
    console.log(arr6);

    arr6.pop(); // [1, "hello"] - 마지막 요소를 삭제
    console.log(arr6);  

    arr6.splice(1, 1); // [1, null] - 1번째 요소를 삭제
    console.log(arr6);

    console.log('-------------------- 배열의 길이 --------------------')
    let arr7 = [1, "hello", null]
    console.log(arr7.length); // 3
  </script>
</body>
</html>
